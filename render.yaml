services:
  - type: web
    name: senthamil-ai-assistant
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
